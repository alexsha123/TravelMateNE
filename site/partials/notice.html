<div id="app-notice" class="app-notice" role="status" aria-live="polite" hidden>
  <span class="notice-message" id="notice-message"></span>
  <span class="notice-actions">
    <button
      class="notice-retry"
      id="notice-retry"
      type="button"
      hidden
    ></button>
    <button
      class="notice-dismiss"
      id="notice-dismiss"
      type="button"
      aria-label="Dismiss message"
    >
      Dismiss
    </button>
  </span>
</div>
