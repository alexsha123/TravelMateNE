<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="theme-color" content="#163d32" />
  <meta name="application-name" content="RoamNE" />
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("roamne-appearance");
        const preference = ["light", "dark"].includes(stored) ? stored : "auto";
        const dark =
          preference === "dark" ||
          (preference === "auto" &&
            window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.themePreference = "auto";
        document.documentElement.dataset.theme = window.matchMedia?.(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    })();
  </script>
  <meta property="og:site_name" content="RoamNE" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta
    property="og:description"
    content="Explore India's Gateway to Southeast Asia. {{DESCRIPTION}}"
  />
  <meta property="og:url" content="{{URL}}" />
  <meta
    property="og:image"
    content="https://roamne.vercel.app/assets/brand/roamne-social-preview.jpg"
  />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta
    property="og:image:alt"
    content="RoamNE — Explore India's Gateway to Southeast Asia."
  />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta
    name="twitter:description"
    content="Explore India's Gateway to Southeast Asia. {{DESCRIPTION}}"
  />
  <meta
    name="twitter:image"
    content="https://roamne.vercel.app/assets/brand/roamne-social-preview.jpg"
  />
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{URL}}" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    onload="
      this.onload = null;
      this.rel = 'stylesheet';
    "
  />
  <noscript
    ><link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
  /></noscript>
  <link
    rel="preload"
    as="image"
    href="/assets/images/destinations/shillong.webp"
    imagesrcset="/assets/images/destinations/shillong-hero-mobile.webp 800w, /assets/images/destinations/shillong.webp 1600w"
    imagesizes="(max-width: 650px) 100vw, 52vw"
    fetchpriority="high"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
